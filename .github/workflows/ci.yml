name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.21.x"
  WAILS_VERSION: "v3.0.0-beta.9"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  macos:
    name: Go checks and arm64 build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Builds the frontend (frontend/dist is embedded by main.go), regenerates
      # bindings, compiles the production arm64 binary, and wraps it in an
      # ad-hoc signed .app bundle.
      - name: Build and package app
        run: wails3 package

      - name: Check generated files are committed
        run: |
          if ! git diff --exit-code -- go.mod go.sum frontend/bindings; then
            echo "::error::go.mod/go.sum or frontend/bindings changed during the build. Run 'wails3 build' locally and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Zip with ditto so the executable bit and code signature survive upload.
      - name: Zip app bundle
        run: ditto -c -k --keepParent bin/work-tools-local.app bin/work-tools-local-macos-arm64.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: work-tools-local-${{ github.sha }}-macos-arm64
          path: bin/work-tools-local-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 7
